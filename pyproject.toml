[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peyja"
version = "0.2.0"
description = "Peyja — Supply-Side OS for Agentic Commerce · Data Spine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "typer>=0.12",
    "tenacity>=8.3",
    "jinja2>=3.1",
    "a2wsgi>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.13",
]

[project.scripts]
peyja = "apps.cli.main:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.13",
]

[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["peyja*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # طول خط — با فرمت‌کننده مدیریت می‌شود
    "RUF001", # کاراکترهای مبهم — ارقام/نشانه‌های فارسی عمدی‌اند
    "RUF002",
    "RUF003",
    "B008",   # الگوی استاندارد Typer/FastAPI در argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["peyja", "apps"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["packages/peyja"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
