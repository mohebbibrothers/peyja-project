# زیرساخت محلی مرحله‌ی ۱ — Postgres + Redis
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: peyja
      POSTGRES_PASSWORD: peyja
      POSTGRES_DB: peyja
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peyja"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
